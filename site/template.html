<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="Farid Rahmani">
<link rel="canonical" href="{{page_url}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{page_url}}">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"
        onload="renderMathInElement(document.querySelector('main'), {delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}], throwOnError: false});"></script>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --text: #1d2733;
  --muted: #5b6673;
  --rule: #e3e7ec;
  --link: #1d6b43;
  --code-bg: #f4f6f8;
  --inline-code-bg: #eef1f4;
  --accent: #1d7449;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419;
    --text: #e2e6ea;
    --muted: #9aa5b1;
    --rule: #2a323c;
    --link: #6fcf97;
    --code-bg: #161b22;
    --inline-code-bg: #1f2630;
    --accent: #6fcf97;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
a { color: var(--link); text-underline-offset: 2px; }
.bar {
  border-bottom: 1px solid var(--rule);
  font-size: 14px;
}
.bar .inner, main, footer .inner {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 16px;
}
.bar .inner {
  display: flex;
  gap: 16px;
  justify-content: space-between;
  align-items: center;
  min-height: 48px;
  flex-wrap: wrap;
}
.bar .book { color: var(--muted); }
.bar .book a { color: var(--muted); }
main { padding-top: 28px; padding-bottom: 48px; }
h1 { font-size: 2.1rem; line-height: 1.2; margin: 0.4em 0 0.6em; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; line-height: 1.3; margin: 2em 0 0.6em; padding-top: 0.4em; border-top: 1px solid var(--rule); }
h1 + p { font-size: 1.1rem; }
p, ul, ol, table { margin: 0 0 1.1em; }
li { margin: 0.25em 0; }
code {
  font: 0.88em/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--inline-code-bg);
  padding: 0.1em 0.35em;
  border-radius: 4px;
}
.highlight, pre {
  background: var(--code-bg) !important;
  border: 1px solid var(--rule);
  border-radius: 8px;
  margin: 0 0 1.1em;
  overflow-x: auto;
}
.highlight pre, pre { margin: 0; padding: 14px 16px; border: 0; }
pre code, .highlight code { background: none; padding: 0; font-size: 14px; line-height: 1.55; }
img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto 0.6em; }
p > img:only-child { border: 1px solid var(--rule); }
em { color: inherit; }
p:has(> img) + p > em:only-child { color: var(--muted); font-size: 0.93rem; }
table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 0.95rem; }
th, td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--code-bg); }
.math-display { overflow-x: auto; overflow-y: hidden; margin: 0 0 1.1em; }
.katex { font-size: 1.05em; }
footer { border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; padding: 20px 0 40px; }
@media (max-width: 520px) {
  body { font-size: 16px; }
  h1 { font-size: 1.7rem; }
  h2 { font-size: 1.25rem; }
  pre code, .highlight code { font-size: 13px; }
}
{{pygments_css}}
</style>
</head>
<body>
<header class="bar">
  <div class="inner">
    <span class="book">From <em>The Complete Guide to PyTorch 2</em> by Farid Rahmani</span>
    <a href="{{repo}}">Code on GitHub</a>
  </div>
</header>
<main>
{{body}}
</main>
<footer>
  <div class="inner">
    Article text and figure © 2026 Farid Rahmani. Code under the
    <a href="{{repo}}/blob/main/LICENSE">MIT License</a>.
  </div>
</footer>
</body>
</html>
